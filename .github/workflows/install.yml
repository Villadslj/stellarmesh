name: Installation Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.0
          cache: true
          environments: >-
            default

      - name: Verify installation
        run: |
          pixi run python -c "
          import stellarmesh as sm
          print(f'stellarmesh version: {sm.__version__}')

          # Verify OCP imports work
          from OCP.TopoDS import TopoDS, TopoDS_Shape, TopoDS_Solid
          from OCP.BRepTools import BRepTools
          from OCP.BRep import BRep_Tool
          from OCP.BRepBndLib import BRepBndLib
          print('OCP imports successful')

          # Verify _get_ocp_method compatibility layer works
          from stellarmesh.geometry import _get_ocp_method
          solid_method = _get_ocp_method(TopoDS, 'Solid')
          print(f'OCP method resolution works: {solid_method}')

          # Verify gmsh import
          import gmsh
          gmsh.initialize()
          gmsh.finalize()
          print('Gmsh initialization successful')

          print('All installation checks passed!')
          "
